services:
  db:
    image: postgres:15
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: always
    command: redis-server --appendonly yes --protected-mode yes --requirepass ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data

  app:
    env_file:
      - .env.settings
      - .env
    build: .
    container_name: spring_app
    restart: always
    depends_on:
      - db
      - redis
    ports:
      - "8080:8080"
    volumes:
      - ./audit:/app/audit
    deploy:
      resources:
        limits:
          memory: 800M
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      YOOKASSA_CURRENCY: RUB
      AUDIT_DIR: /app/audit
      TZ: Europe/Moscow

volumes:
  pgdata:
  redis_data: