services:
  db:
    image: postgres:15
    container_name: postgres_db
    restart: on-failure
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data




  redis:
    image: redis:7-alpine
    container_name: redis
    restart: on-failure
    command: redis-server --appendonly yes --protected-mode yes --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data





volumes:
  pgdata:
  redis_data: