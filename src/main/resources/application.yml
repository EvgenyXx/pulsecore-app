spring:

  profiles:
    active: local
  output:
    ansi:
      enabled: ALWAYS
  security:
    oauth2:
      client:
        provider:
          yandex:
            authorization-uri: https://oauth.yandex.ru/authorize
            token-uri: https://oauth.yandex.ru/token
            user-info-uri: https://login.yandex.ru/info
            user-name-attribute: id
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USER}
    password: ${MAIL_PASS}
    protocol: smtps
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  session:
    store-type: redis
    redis:
      repository-type: indexed


management:
  endpoints:
    web:
      exposure:
        include: loggers,health,info
  endpoint:
    loggers:
      enabled: true




server:
  servlet:
    session:
      cookie:
        name: PULSECORE_SESSION
        http-only: true
        same-site: Lax



audit:
  dir: ${AUDIT_DIR:audit}


app:
  base-url: ${APP_BASE_URL:http://localhost:8080}
  qr-color: ${QR_COLOR}
  security:
    public-urls:
      - /
      - /index.html
      - /js/**
      - /css/**
      - /register.html
      - /api/players
      - /subscribe.html
      - /profile.html
      - /favicon.png
      - /apple-touch-icon.png
      - /apple-touch-icon-precomposed.png
      - /manifest.json
      - /sw.js
      - /icons/**
      - /robots.txt
      - /error
      - /api/player/**
      - /api/payment/webhook
      - /oauth-finish.html
      - /manifest.json
      - /swagger-ui/**
      - /v3/api-docs/**
      - /swagger-resources/**
      - /swagger-ui.html
      - /actuator/**
      - /compare
      - /compare.html
    authenticated-urls:
      - /api/player/**
    admin-urls:
      - /admin.html
      - /api/admin/**
    oauth:
      unknown-email-domain: "@unknown.pulsecore"

  remember-me:
    cookie-name: REMEMBER_ME
    max-age-seconds: 2592000
    same-site: Lax

  vapid:
    public-key: ${VAPID_PUBLIC_KEY}
    private-key: ${VAPID_PRIVATE_KEY}
  admin:
    email: ${ADMIN_EMAIL}

  yookassa:
    shop-id: ${YOOKASSA_SHOP_ID}
    secret-key: ${YOOKASSA_SECRET_KEY}
    return-url: ${YOOKASSA_RETURN_URL}
    yookassa-api-url: ${YOOKASSA_API_URL}
    currency: ${YOOKASSA_CURRENCY}

  masters-api:
    admin:
      url: ${MASTERS_API_ADMIN_URL}
      method: POST
      user-agent: Mozilla/5.0
      action: tourslist
      country: RUS
      timeout: 90000
    get:
      url: ${MASTER_API_GET_URL}
      method: GET
      user-agent: Mozilla/5.0
      action: tourslist
      country: RUS
      timeout: 90000


  mail:
    from: ${MAIL_FROM}

  settings:
    tournament:
      cache:
        lineup-hash-ttl: ${TOURNAMENT_CACHE_LINEUP_HASH_TTL:6h}
        tournament-status-ttl: ${TOURNAMENT_CACHE_TOURNAMENT_STATUS_TTL:30m}
        discovery-hash-ttl: ${APP_CACHE_DISCOVERY_HASH_TTL:2h}
      cleanup:
        start: ${TOURNAMENT_CLEANUP_START:30}
        end: ${TOURNAMENT_CLEANUP_END:3}
      player-history:
        start: ${TOURNAMENT_PLAYER_HISTORY_START:1}
        end: ${TOURNAMENT_PLAYER_HISTORY_END:2023-01-01}
    player:
      subscription:
        trial-days: ${PLAYER_TRIAL_DAYS:7}