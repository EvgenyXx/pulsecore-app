
spring:

      profiles:
            active: local
      security:
            oauth2:
                  client:
                        provider:
                              yandex:
                                    authorization-uri: https://oauth.yandex.ru/authorize
                                    token-uri: https://oauth.yandex.ru/token
                                    user-info-uri: https://login.yandex.ru/info
                                    user-name-attribute: id
      datasource:
            url: ${SPRING_DATASOURCE_URL}
            username: ${SPRING_DATASOURCE_USERNAME}
            password: ${SPRING_DATASOURCE_PASSWORD}
      jpa:
            hibernate:
                  ddl-auto: none
            show-sql: false
      flyway:
            enabled: true
            locations: classpath:db/migration
            baseline-on-migrate: true
            baseline-version: 0
      mail:
            host: ${MAIL_HOST}
            port: ${MAIL_PORT}
            username: ${MAIL_USER}
            password: ${MAIL_PASS}
            protocol: smtps
            properties:
                  mail:
                        smtp:
                              auth: true
                              starttls:
                                    enable: true
      session:
            store-type: redis
            redis:
                  repository-type: indexed


management:
      endpoints:
            web:
                  exposure:
                        include: loggers,health,info
      endpoint:
            loggers:
                  enabled: true




server:
      servlet:
            session:
                  cookie:
                        name: PULSECORE_SESSION
                        http-only: true
                        same-site: Lax



app:
      security:
            public-urls:
                  - /
                  - /index.html
                  - /register.html
                  - /api/players
                  - /subscribe.html
                  - /profile.html
                  - /dashboard.html
                  - /img.png
                  - /favicon.ico
                  - /robots.txt
                  - /error
                  - /api/player/**
                  - /api/payment/webhook
                  - /oauth-finish.html
                  - /manifest.json
                  - /swagger-ui/**
                  - /v3/api-docs/**
                  - /swagger-resources/**
                  - /swagger-ui.html
                  - /actuator/**
                  - /compare
                  - /compare.html
            authenticated-urls:
                  - /api/player/**
            admin-urls:
                  - /admin.html
                  - /api/admin/**
            oauth:
                  unknown-email-domain: "@unknown.pulsecore"
      remember-me:
            cookie-name: REMEMBER_ME
            max-age-seconds: 2592000
            same-site: Lax
      vapid:
            public-key: ${VAPID_PUBLIC_KEY}
            private-key: ${VAPID_PRIVATE_KEY}
      admin:
            email: ${ADMIN_EMAIL}
      yookassa:
            shop-id: ${YOOKASSA_SHOP_ID}
            secret-key: ${YOOKASSA_SECRET_KEY}
            return-url: ${YOOKASSA_RETURN_URL}
            yookassa-api-url: ${YOOKASSA_API_URL}
            currency: ${YOOKASSA_CURRENCY}
      masters-api:
            url: ${MASTERS_API_URL}
            method: POST
            user-agent: Mozilla/5.0
            action: tourslist
            country: RUS
            timeout: 45000
      mail:
            from: ${MAIL_FROM}