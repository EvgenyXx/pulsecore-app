<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta name="theme-color" content="#0a0b0d">
    <title>PulseCore — Магазин</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="PulseCore Shop">
    <link rel="icon" type="image/png" href="/img.png">
    <link rel="stylesheet" href="/css/shop/theme.css">
    <link rel="stylesheet" href="/css/shop/base.css">
    <link rel="stylesheet" href="/css/shop/layout.css">
    <link rel="stylesheet" href="/css/shop/grid.css">
    <link rel="stylesheet" href="/css/shop/cards.css">
    <link rel="stylesheet" href="/css/shop/product.css">
    <link rel="stylesheet" href="/css/shop/cart.css">
    <link rel="stylesheet" href="/css/shop/checkout.css">
    <link rel="stylesheet" href="/css/shop/orders.css">
    <link rel="stylesheet" href="/css/shop/shop-nav.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="has-shop-nav">

<header class="header">
    <div class="header-inner">
        <a href="/dashboard" class="logo-back" aria-label="Назад">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        </a>
        <a href="/shop" class="logo">PulseCore <span class="logo-badge">SHOP</span></a>
    </div>
</header>

<main class="container">

    <section id="shopPageCatalog" class="shop-page">
        <div class="shop-search">
            <span class="shop-search-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            </span>
            <input type="text" id="searchInput" class="shop-search-input" placeholder="Поиск товаров..." autocomplete="off">
            <button type="button" class="shop-search-clear hidden" id="searchClear" aria-label="Очистить">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
        </div>
        <div id="productsGrid" class="products-grid">
            <p class="muted">Загрузка...</p>
        </div>
    </section>

    <section id="shopPageCategories" class="shop-page hidden">
        <h1 class="shop-page-title">Категории</h1>
        <div id="categoriesList" class="categories-list"></div>
    </section>

    <section id="shopPageCategory" class="shop-page hidden">
        <button class="shop-back-link" id="categoryBackBtn" type="button">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
            <span>Все категории</span>
        </button>
        <h1 class="shop-page-title" id="categoryTitle">Категория</h1>
        <div id="categoryProductsGrid" class="products-grid">
            <p class="muted">Загрузка...</p>
        </div>
    </section>

    <section id="shopPageProduct" class="shop-page hidden">
        <button class="shop-back-link" id="productBackBtn" type="button">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
            <span>Назад</span>
        </button>
        <div id="productContent">
            <p class="muted">Загрузка...</p>
        </div>
    </section>

    <section id="shopPageCart" class="shop-page hidden">
        <h1 class="shop-page-title">Корзина</h1>
        <div id="cartContent" class="cart-content">
            <p class="muted">Корзина пуста</p>
        </div>
    </section>

    <section id="shopPageCheckout" class="shop-page hidden">
        <h1 class="shop-page-title">Оформление</h1>
        <div id="checkoutContent">
            <p class="muted">Загрузка...</p>
        </div>
    </section>

    <section id="shopPageOrders" class="shop-page hidden">
        <h1 class="shop-page-title">Мои заказы</h1>
        <div id="ordersContent" class="orders-content">
            <p class="muted">Заказов пока нет</p>
        </div>
    </section>

</main>

<nav class="shop-nav" id="shopNav">
    <a href="/dashboard" class="shop-nav-item shop-nav-item-external" data-shop-tab="app">
        <span class="shop-nav-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
        </span>
        <span class="shop-nav-label">PulseCore</span>
    </a>
    <a href="#/" class="shop-nav-item active" data-shop-tab="catalog">
        <span class="shop-nav-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
        </span>
        <span class="shop-nav-label">Каталог</span>
    </a>
    <a href="#/categories" class="shop-nav-item" data-shop-tab="categories">
        <span class="shop-nav-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
        </span>
        <span class="shop-nav-label">Категории</span>
    </a>
    <a href="#/cart" class="shop-nav-item" data-shop-tab="cart">
        <span class="shop-nav-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
            <span class="shop-nav-badge hidden" id="cartBadge">0</span>
        </span>
        <span class="shop-nav-label">Корзина</span>
    </a>
    <a href="#/orders" class="shop-nav-item" data-shop-tab="orders">
        <span class="shop-nav-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
        </span>
        <span class="shop-nav-label">Заказы</span>
    </a>
</nav>

<script src="/js/shop/api/http.js"></script>
<script src="/js/shop/api/categories-api.js"></script>
<script src="/js/shop/api/products-api.js"></script>
<script src="/js/shop/api/cart-api.js"></script>
<script src="/js/shop/api/orders-api.js"></script>
<script src="/js/shop/ui/loader.js"></script>
<script src="/js/shop/ui/toast.js"></script>
<script src="/js/shop/cart-store.js"></script>
<script src="/js/shop/pages/catalog.js"></script>
<script src="/js/shop/pages/categories.js"></script>
<script src="/js/shop/pages/category.js"></script>
<script src="/js/shop/pages/product.js"></script>
<script src="/js/shop/pages/cart.js"></script>
<script src="/js/shop/pages/checkout.js"></script>
<script src="/js/shop/pages/orders.js"></script>
<script src="/js/shop/shop-router.js"></script>
<script src="/js/shop/shop-app.js"></script>
</body>
</html>
