<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, height=device-height">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>PulseCore — H2H</title>
    <script type="module">
        import {initThemeSync} from '/js/modules/theme-sync.js';
        initThemeSync();
    </script>
    <link rel="manifest" href="/manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="PulseCore">
    <link rel="icon" type="image/png" href="/img.png">
    <link rel="stylesheet" href="/css/app.css">
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = {
        theme: {
            extend: {
                screens: {
                    'xs': '475px',
                    'sm': '640px',
                    'md': '768px',
                    'lg': '1024px',
                    'xl': '1280px',
                    '2xl': '1536px'
                }
            }
        }
    }</script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
          rel="stylesheet">
    <style>
        * {
            -webkit-tap-highlight-color: transparent;
        }

        body {
            padding-top: env(safe-area-inset-top, 0px);
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            background: var(--bg, #0c0c18);
            overscroll-behavior: none;
        }

        .compare-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            padding: 0 4px;
        }

        .compare-title {
            font-size: 1.25rem;
            font-weight: 800;
            color: #fff;
        }

        .compare-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .period-toggle {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.7rem;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(255, 255, 255, 0.03);
            color: #a5b4fc;
        }

        .burger-btn {
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            cursor: pointer;
            color: #a1a1aa;
        }

        .period-sheet-overlay {
            position: fixed;
            inset: 0;
            z-index: 100;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: flex-end;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .period-sheet-overlay.open {
            opacity: 1;
            pointer-events: auto;
        }

        .period-sheet {
            background: #18181b;
            border-radius: 20px 20px 0 0;
            width: 100%;
            max-width: 500px;
            padding: 20px 16px 32px;
            transform: translateY(100%);
            transition: transform 0.35s cubic-bezier(0.32, 0.72, 0, 1);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-bottom: none;
        }

        .period-sheet-overlay.open .period-sheet {
            transform: translateY(0);
        }

        .period-sheet-handle {
            width: 36px;
            height: 4px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
            margin: 0 auto 18px;
        }

        .period-sheet-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            padding: 14px 16px;
            border-radius: 12px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            border: none;
            text-align: left;
            color: #d4d4d8;
            background: rgba(255, 255, 255, 0.03);
            margin-bottom: 4px;
        }

        .period-sheet-btn.active {
            background: rgba(99, 102, 241, 0.12);
            color: #c7d2fe;
            font-weight: 600;
        }

        .date-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 12px;
            padding: 0 4px;
        }

        .date-input {
            flex: 1;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            color: #e5e5e5;
            padding: 8px 10px;
            font-size: 0.75rem;
            outline: none;
            font-family: 'Inter';
            min-width: 0;
        }

        /* ===== КОЛЁСА ===== */
        .wheels-row {
            display: flex;
            gap: 12px;
            align-items: stretch;
            margin-bottom: 12px;
            margin-top: 220px;
            position: relative;
        }

        .wheel-container {
            position: relative;
            flex: 1;
            min-width: 0;
            background: transparent;
            border-radius: 30px;
            overflow: hidden;
        }

        .wheel-picker {
            height: 560px;
            overflow-y: auto;
            scroll-snap-type: y mandatory;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            -ms-overflow-style: none;
            padding: 100px 0;
            position: relative;
            overscroll-behavior: contain;
            background: transparent;
            mask-image: linear-gradient(
                    to bottom,
                    transparent 0%,
                    black 25%,
                    black 75%,
                    transparent 100%
            );
            -webkit-mask-image: linear-gradient(
                    to bottom,
                    transparent 0%,
                    black 25%,
                    black 75%,
                    transparent 100%
            );
        }

        .wheel-picker::-webkit-scrollbar {
            display: none;
        }

        .wheel-option {
            scroll-snap-align: center;
            height: 52px;
            min-height: 52px;
            max-height: 52px;
            width: 100%;
            max-width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 4px;
            cursor: pointer;
            font-size: 17px;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.25);
            user-select: none;
            -webkit-user-select: none;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: all 0.25s ease;
            flex-shrink: 0;
        }

        .wheel-option.selected {
            color: #ffffff;
            font-weight: 600;
            font-size: 20px;
        }

        .vs-badge {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 0.75rem;
            color: #fff;
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.5);
            flex-shrink: 0;
            align-self: center;
        }

        .cards-row {
            display: flex;
            gap: 12px;
            margin-top: 40px;
        }

        .result-card {
            flex: 1;
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 10px 8px;
            text-align: left;
        }

        .result-card .player-name {
            color: #fff;
            font-weight: 800;
            font-size: 0.8rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-align: center;
            margin-bottom: 2px;
        }

        .result-card .player-league {
            color: #a5b4fc;
            font-size: 0.6rem;
            text-align: center;
            margin-bottom: 6px;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.65rem;
            margin-bottom: 3px;
        }

        .stat-label {
            color: #a1a1aa;
            font-size: 0.6rem;
        }

        .stat-value {
            color: #fff;
            font-weight: 700;
            font-size: 0.65rem;
        }

        .card-spacer {
            width: 52px;
            flex-shrink: 0;
        }

        @media (max-width: 640px) {
            main {
                display: flex;
                flex-direction: column;
                flex: 1;
                padding: 8px 10px;
                height: 100dvh;
                overflow: hidden;
            }

            .max-w-5xl {
                display: flex;
                flex-direction: column;
                height: 100%;
            }

            .compare-header {
                flex-shrink: 0;
            }

            .wheels-row {
                margin: 0;
                flex-shrink: 0;
                margin-top: 65%;
            }

            .cards-row {
                margin-top: auto;
                padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 50px);
                flex-shrink: 0;
            }

            .wheel-picker {
                height: 300px;
                min-height: 300px;
                max-height: 300px;
                overflow-y: auto;
                scroll-snap-type: y mandatory;
                -webkit-overflow-scrolling: touch;
                scrollbar-width: none;
                -ms-overflow-style: none;
                padding: 120px 0;
                position: relative;
                overscroll-behavior: contain;
                background: transparent;
                perspective: 800px;
                scroll-behavior: smooth;
                flex-shrink: 0;
            }

            .wheel-option {
                scroll-snap-align: center;
                height: 52px;
                min-height: 52px;
                max-height: 52px;
                width: 100%;
                max-width: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
                cursor: pointer;
                font-size: 17px;
                font-weight: 400;
                color: rgba(255, 255, 255, 0.15);
                user-select: none;
                -webkit-user-select: none;
                text-align: center;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
                transition: color 0.15s ease, transform 0.15s ease;
                will-change: transform;
                flex-shrink: 0;
            }

            .wheel-option.selected {
                color: #ffffff;
                font-weight: 700;
                font-size: 22px;
                transform: translateZ(50px) scale(1.15);
                z-index: 10;
            }

            .vs-badge {
                width: 34px;
                height: 34px;
                font-size: 0.65rem;
                flex-shrink: 0;
            }

            .compare-title {
                font-size: 1rem;
            }

            .result-card {
                padding: 15px 12px;
                border-radius: 0;
                border: none;
                background: transparent;
                flex-shrink: 0;
            }

            .result-card .player-name {
                font-size: 1rem;
                margin-bottom: 4px;
            }

            .result-card .player-league {
                font-size: 0.7rem;
                margin-bottom: 8px;
            }

            .stat-row {
                display: flex;
                justify-content: space-between;
                align-items: center;
                font-size: 0.75rem;
                margin-bottom: 5px;
                gap: 8px;
            }

            .stat-label {
                color: #a1a1aa;
                font-size: 0.7rem;
                line-height: 1;
                white-space: nowrap;
            }

            .stat-value {
                color: #fff;
                font-weight: 700;
                font-size: 0.75rem;
                line-height: 1;
                white-space: nowrap;
                text-align: right;
            }
        }
    </style>
</head>
<body class="flex flex-col md:flex-row min-h-screen">
<div class="bg-mesh"></div>
<div class="bg-grid"></div>
<div class="bg-orb bg-orb-1"></div>
<div class="bg-orb bg-orb-2"></div>
<div class="nebula"></div>
<div class="stars" id="starsContainer"></div>
<div id="burgerMenuContainer"></div>

<aside class="hidden md:flex glass-sidebar w-72 min-h-screen p-6 flex-col relative z-10 shrink-0">
    <div class="flex items-center gap-3 mb-10 px-1">
        <img src="/img.png" alt="PulseCore" class="w-11 h-11 rounded-xl shadow-lg object-cover">
        <div>
            <h1 class="text-lg font-bold bg-gradient-to-r from-indigo-400 to-indigo-300 bg-clip-text text-transparent tracking-tight">
                PulseCore</h1>
            <p id="sidebarPlayerName" class="text-xs text-zinc-400"></p>
        </div>
    </div>
    <nav class="flex flex-col gap-1 flex-1">
        <div class="nav-item" onclick="window.location.href='/dashboard'">
            <span class="nav-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                        stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline
                    points="9 22 9 12 15 12 15 22"/></svg></span>
            <div>
                <div class="font-medium text-sm">Главная</div>
            </div>
        </div>
        <div class="nav-item active" id="nav-compare">
            <span class="nav-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                        stroke-width="2"><path d="M16 3h5v5"/><path d="M8 3H3v5"/><path d="M21 3l-7 7"/><path
                    d="M3 3l7 7"/><path d="M16 21h5v-5"/><path d="M8 21H3v-5"/><path d="M21 21l-7-7"/><path
                    d="M3 21l7 7"/></svg></span>
            <div>
                <div class="font-medium text-sm">H2H</div>
            </div>
        </div>
        <div class="nav-item" onclick="window.location.href='/live'">
            <span class="nav-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                        stroke-width="2"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5"
                                                                                                        width="15"
                                                                                                        height="14"
                                                                                                        rx="2" ry="2"/></svg></span>
            <div>
                <div class="font-medium text-sm">Live</div>
            </div>
        </div>
        <div class="nav-item" onclick="window.location.href='/analytics'">
            <span class="nav-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                        stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20"
                                                                                                      x2="12" y2="4"/><line
                    x1="6" y1="20" x2="6" y2="14"/></svg></span>
            <div>
                <div class="font-medium text-sm">Аналитика</div>
            </div>
        </div>
        <div class="nav-item" onclick="window.location.href='/profile'">
            <span class="nav-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                        stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle
                    cx="12" cy="7" r="4"/></svg></span>
            <div>
                <div class="font-medium text-sm">Настройки</div>
            </div>
        </div>
    </nav>
    <button onclick="logout()"
            class="flex items-center gap-2 text-zinc-500 hover:text-red-400 text-sm mt-auto py-2 px-3 rounded-lg hover:bg-red-500/5 w-full">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
        <span>Выйти</span>
    </button>
</aside>

<main class="flex-1 relative z-10 p-3 sm:p-6 md:p-7 lg:p-9 xl:p-10">
    <div class="max-w-5xl mx-auto">
        <div class="compare-header">
            <h1 class="compare-title">H2H</h1>
            <div class="compare-actions">
                <button class="period-toggle" onclick="togglePeriodSheet()">
                    <span id="periodLabel">Всё время</span>
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="6 9 12 15 18 9"/>
                    </svg>
                </button>
                <button class="burger-btn md:hidden" onclick="window.toggleMobileMenu()">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="3" y1="6" x2="21" y2="6"/>
                        <line x1="3" y1="12" x2="21" y2="12"/>
                        <line x1="3" y1="18" x2="21" y2="18"/>
                    </svg>
                </button>
            </div>
        </div>

        <div class="wheels-row">
            <div class="wheel-container">
                <div id="pickerLeft" class="wheel-picker"></div>
            </div>
            <div class="vs-badge">VS</div>
            <div class="wheel-container">
                <div id="pickerRight" class="wheel-picker"></div>
            </div>
        </div>

        <div class="cards-row">
            <div id="leftCard" class="result-card">
                <p class="text-zinc-500 text-sm text-center">Выберите игрока</p>
            </div>
            <div class="card-spacer"></div>
            <div id="rightCard" class="result-card">
                <p class="text-zinc-500 text-sm text-center">Выберите игрока</p>
            </div>
        </div>
    </div>
</main>

<div class="period-sheet-overlay" id="periodSheetOverlay" onclick="togglePeriodSheet()">
    <div class="period-sheet" onclick="event.stopPropagation()">
        <div class="period-sheet-handle"></div>
        <button class="period-sheet-btn" onclick="setPeriod('week')">Неделя</button>
        <button class="period-sheet-btn" onclick="setPeriod('month')">Месяц</button>
        <button class="period-sheet-btn" onclick="setPeriod('year')">Год</button>
        <button class="period-sheet-btn active" onclick="setPeriod('all')">Всё время</button>
        <div class="date-row">
            <input type="date" id="customStart" class="date-input" placeholder="дд.мм.гггг">
            <span class="text-zinc-500 text-xs">—</span>
            <input type="date" id="customEnd" class="date-input" placeholder="дд.мм.гггг">
        </div>
        <button class="period-sheet-btn" onclick="loadCustom()"
                style="justify-content: center; background: rgba(99,102,241,0.1); color: #c7d2fe; margin-top: 8px;">
            Применить
        </button>
    </div>
</div>

<script type="module" src="/js/compare-app.js"></script>
<script type="module">
    import {initBurgerMenu} from '/js/modules/burger-menu.js';
    import {initRoleCheck} from '/js/modules/role-check.js';

    initBurgerMenu();
    initRoleCheck();
</script>
<script type="module">
    import {initStars} from '/js/modules/stars.js';

    initStars();
</script>
<script type="module">
    import {initThemePicker, toggleThemeSheet, setTheme} from '/js/modules/theme-picker.js';

    initThemePicker();
    window.toggleThemeSheet = toggleThemeSheet;
    window.setTheme = setTheme;
</script>
</body>
</html>
