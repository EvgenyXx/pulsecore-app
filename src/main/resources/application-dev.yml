
spring:
  security:
    oauth2:
      client:
        registration:
          yandex:
            client-id: ${YANDEX_CLIENT_ID}
            client-secret: ${YANDEX_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/yandex"
            scope:
              - login:email
              - login:info
              - login:default_phone
  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: 6379
      password: ${REDIS_PASSWORD:}
  session:
    timeout: 5m

logging:
  level:
    root: WARN
    ru.pulsecore.app: info
    org.springframework: WARN
    org.hibernate: WARN
    ru.pulsecore.app.modules.notification_modules.infrastructure.event.PlayerCreatedListener: INFO
    ru.pulsecore.app.modules.player_modeles.application.subscription.SubscriptionService: INFO
    ru.pulsecore.app.modules.tournament_module.service.tornament.TournamentFinishService: INFO
    ru.pulsecore.app.modules.tournament_module.service.tornament.TournamentCascadeSyncService: INFO


app:
  base-url: http://localhost:8080
  qr-color: "#14b8a6"

server:
  port: 8080
  servlet:
    session:
      cookie:
        secure: false